name: Lean kernel verification

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: Build both equivalence endpoints
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Install Lean 4 and build
        uses: leanprover/lean-action@v1
        with:
          build: true
      - name: Audit original verified endpoint
        run: lake env lean EquivalenceMain.lean
      - name: Audit new Foundation-free endpoint
        run: lake env lean FoundationFreeKernelAudit.lean
